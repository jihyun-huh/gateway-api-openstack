# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.1/www/static/schema.json
version: 2

project_name: gateway-api-openstack

builds:
  - id: openstack-gateway-controller
    main: ./cmd/openstack-gateway-controller
    binary: openstack-gateway-controller
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -buildvcs=false
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: octavia-capability-probe
    main: ./cmd/octavia-capability-probe
    binary: octavia-capability-probe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -buildvcs=false
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binaries
    ids:
      - openstack-gateway-controller
      - octavia-capability-probe
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: SECURITY.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

source:
  enabled: true
  name_template: "{{ .ProjectName }}_v{{ .Version }}_source"
  prefix_template: "{{ .ProjectName }}-v{{ .Version }}/"

snapshot:
  version_template: "{{ incpatch .Version }}-devel.{{ .ShortCommit }}"

release:
  draft: true
  use_existing_draft: true
  mode: keep-existing
  prerelease: auto
  header: |
    > [!WARNING]
    > gateway-api-openstack is pre-alpha. This release does not claim
    > production readiness or Gateway API conformance.
