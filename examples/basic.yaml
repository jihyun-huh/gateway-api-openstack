apiVersion: v1
kind: Namespace
metadata:
  name: gateway-api-openstack-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gateway-api-openstack-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-api-openstack-demo-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-api-openstack-demo-backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gateway-api-openstack-demo
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: gateway-api-openstack-demo-backend
  ports:
    - name: http
      appProtocol: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: openstack
spec:
  # This must exactly match GATEWAY_OPENSTACK_CONTROLLER_NAME.
  controllerName: example.com/gateway-api-openstack
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: gateway-api-openstack-demo
spec:
  gatewayClassName: openstack
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: basic
  namespace: gateway-api-openstack-demo
spec:
  parentRefs:
    - name: edge
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 80
