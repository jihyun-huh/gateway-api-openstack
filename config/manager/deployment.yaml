apiVersion: apps/v1
kind: Deployment
metadata:
  name: openstack-gateway-controller
  labels:
    app.kubernetes.io/name: openstack-gateway-controller
    app.kubernetes.io/part-of: gateway-api-openstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openstack-gateway-controller
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openstack-gateway-controller
        app.kubernetes.io/part-of: gateway-api-openstack
    spec:
      serviceAccountName: openstack-gateway-controller
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --octavia-microversion=2.5
          envFrom:
            - configMapRef:
                name: openstack-gateway-controller-config
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: openstack-clouds
              mountPath: /etc/openstack
              readOnly: true
      volumes:
        - name: openstack-clouds
          secret:
            secretName: openstack-clouds
            defaultMode: 0440
            items:
              - key: clouds.yaml
                path: clouds.yaml
