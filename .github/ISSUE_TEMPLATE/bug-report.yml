name: Bug report
description: Report reproducible incorrect controller behavior.
title: "[Bug]: "
labels:
  - kind/bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials or private tenant data. Report security
        vulnerabilities using the private process in SECURITY.md.
  - type: input
    id: controller-version
    attributes:
      label: Controller version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: gateway-api-version
    attributes:
      label: Gateway API version
      placeholder: v1.6.1
    validations:
      required: true
  - type: input
    id: openstack-version
    attributes:
      label: OpenStack and Octavia versions
    validations:
      required: true
  - type: input
    id: amphora-topology
    attributes:
      label: Amphora topology
      description: Confirm the provider is Amphora and report single or active-standby when known.
      placeholder: amphora, active-standby
    validations:
      required: true
  - type: dropdown
    id: member-mode
    attributes:
      label: Backend member mode
      options:
        - NodePort
        - Pod IP (future or experimental builds only)
        - Unknown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Relevant Kubernetes status, events, and redacted logs
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and private cloud identifiers.
          required: true
        - label: This is not a security vulnerability.
          required: true
