name: Feature request
description: Propose a focused Gateway API or OpenStack capability.
title: "[Feature]: "
labels:
  - kind/feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        Describe the user or operator problem before the proposed solution.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Concrete use case
    validations:
      required: true
  - type: input
    id: gateway-feature
    attributes:
      label: Related Gateway API resource or feature
  - type: input
    id: openstack-capability
    attributes:
      label: Required OpenStack capability
      description: >-
        Name the Octavia API, microversion, Neutron, or Barbican capability
        involved.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: textarea
    id: portability
    attributes:
      label: Gateway API compatibility
      description: >-
        Explain whether the proposal maps cleanly to Gateway API semantics and
        which conformance tests it affects.
  - type: textarea
    id: ownership-impact
    attributes:
      label: OpenStack ownership impact
      description: >-
        Explain whether the proposal would read or mutate existing worker
        Neutron ports, security groups, OCCM resources, or other resources owned
        by the operator.
  - type: checkboxes
    id: ownership
    attributes:
      label: Ownership
      options:
        - label: >-
            I understand that adopting or mutating resources owned by OCCM is
            out of scope.
          required: true
