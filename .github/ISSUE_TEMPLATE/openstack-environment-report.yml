name: OpenStack environment report
description: Share test results from an OpenStack Amphora environment.
title: "[Environment]: "
labels:
  - kind/provider-report
body:
  - type: markdown
    attributes:
      value: |
        Share only information you are authorized to publish. Never include
        credentials, OpenStack project IDs, public IPs, or customer names.
  - type: input
    id: environment
    attributes:
      label: Public environment or organization name
      description: Use “anonymous” if the name cannot be published.
    validations:
      required: true
  - type: input
    id: controller-version
    attributes:
      label: Controller release or commit
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes and Gateway API versions
    validations:
      required: true
  - type: input
    id: openstack
    attributes:
      label: OpenStack and Octavia releases
    validations:
      required: true
  - type: input
    id: octavia-microversion
    attributes:
      label: Negotiated Octavia API microversion
      description: Enter “unknown” if you could not determine it.
    validations:
      required: true
  - type: input
    id: amphora-topology
    attributes:
      label: Amphora topology
      description: >-
        Confirm that the provider is Amphora and state whether its topology is
        SINGLE or ACTIVE_STANDBY.
      placeholder: amphora, ACTIVE_STANDBY
    validations:
      required: true
  - type: input
    id: networking
    attributes:
      label: CNI, kube-proxy mode, and cluster CIDRs
      description: >-
        Describe Service and Pod CIDR reachability without publishing private
        ranges when they are sensitive.
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Node address, member mode, and traffic policy
      description: >-
        For example: InternalIP, NodePort, and externalTrafficPolicy: Cluster.
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: VIP, member, and external network relationships
      description: >-
        Describe reachability without including network IDs, private addresses,
        or customer data.
    validations:
      required: true
  - type: textarea
    id: services
    attributes:
      label: Optional services, permissions, and quotas
      description: >-
        Note whether Floating IPs, custom VIP security groups, and Barbican are
        available. Include relevant roles or quotas without private identifiers.
  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities tested
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Test results and reproduction details
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Publication checks
      options:
        - label: I am authorized to publish this information.
          required: true
        - label: I removed credentials and private cloud identifiers.
          required: true
